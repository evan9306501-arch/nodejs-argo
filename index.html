<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>可爱猫咪主页</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: "Microsoft YaHei", sans-serif;
        background: #fdf6ee;
        color: #333;
        line-height: 1.6;
    }

    header {
        background: linear-gradient(135deg, #ffb347, #ffcc70);
        color: white;
        text-align: center;
        padding: 60px 20px;
    }

    header h1 {
        font-size: 3rem;
        margin-bottom: 10px;
    }

    header p {
        font-size: 1.2rem;
    }

    .container {
        width: 90%;
        max-width: 1200px;
        margin: 40px auto;
    }

    .cat-card {
        background: white;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        margin-bottom: 30px;
        transition: transform 0.3s;
    }

    .cat-card:hover {
        transform: translateY(-8px);
    }

    .cat-card img {
        width: 100%;
        height: 300px;
        object-fit: cover;
    }

    .cat-content {
        padding: 20px;
    }

    .cat-content h2 {
        color: #ff9f1c;
        margin-bottom: 10px;
    }

    .features {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 20px;
        margin-top: 40px;
    }

    .feature {
        background: white;
        padding: 25px;
        border-radius: 15px;
        text-align: center;
        box-shadow: 0 5px 15px rgba(0,0,0,0.08);
    }

    .feature span {
        font-size: 40px;
        display: block;
        margin-bottom: 10px;
    }

    footer {
        text-align: center;
        padding: 30px;
        background: #333;
        color: white;
        margin-top: 50px;
    }

    .button {
        display: inline-block;
        margin-top: 15px;
        padding: 10px 20px;
        background: #ff9f1c;
        color: white;
        text-decoration: none;
        border-radius: 999px;
        transition: 0.3s;
    }

    .button:hover {
        background: #ff7b00;
    }
</style>
</head>

<body>

<header>
    <h1>🐱 可爱猫咪乐园</h1>
    <p>欢迎来到属于猫咪爱好者的小天地</p>
</header>

<div class="container">

    <div class="cat-card">
        <img src="https://images.unsplash.com/photo-1519052537078-e6302a4968d4?w=1200"
             alt="猫咪">
        <div class="cat-content">
            <h2>橘猫小王子</h2>
            <p>
                橘猫以其圆润可爱的外表和亲人的性格深受大家喜爱。
                它们喜欢晒太阳、睡觉以及享受美食。
            </p>
            <a href="#" class="button">了解更多</a>
        </div>
    </div>

    <div class="features">
        <div class="feature">
            <span>😺</span>
            <h3>活泼可爱</h3>
            <p>喜欢与主人互动和玩耍。</p>
        </div>

        <div class="feature">
            <span>🐟</span>
            <h3>最爱零食</h3>
            <p>小鱼干永远是它们的最爱。</p>
        </div>

        <div class="feature">
            <span>🛏️</span>
            <h3>睡眠达人</h3>
            <p>每天睡眠时间可达12~16小时。</p>
        </div>

        <div class="feature">
            <span>❤️</span>
            <h3>治愈陪伴</h3>
            <p>给生活带来温暖与快乐。</p>
        </div>
    </div>

</div>

<footer>
    <p>© 2026 可爱猫咪乐园 | Made with ❤️ for Cats</p>
</footer>

</body>
</html>
